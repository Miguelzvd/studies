<meta charset="utf-8" />
<script>
  const valorJantar = Number(prompt("Valor do jantar:"));
  const taxa = 0.1;

  const valorTaxa = valorJantar * taxa;
  const valorTotal = (valorTaxa + valorJantar);

  alert(`Valor do Jantar: ${valorJantar.toFixed(2)}\nTaxa do garçom: R$${valorTaxa.toFixed(2)}\nTotal a pagar: R$${valorTotal.toFixed(2)}`);
</script>
