<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="icon" type="image/png" href="img/livro.png" />
    <link rel="stylesheet" href="css/estilo.css" />
  </head>
  <body>
    <img src="img/ex4_2.jpg" alt="Balançá Peso" />
    <h1>Programa Cálculo do Peso Ideal</h1>

    <form>
      <p>
        Nome:
        <input type="text" id="inNome" />
      </p>

      <p>
        Sexo:
        <input type="radio" name="sexo" id="inMasculino" required /> Masculino
        <input type="radio" name="sexo" id="inFemenino" required /> Femenino
      </p>

      <p>
        Altura:
        <input type="number" step="0.01" id="inAltura" />
      </p>

      <input type="submit" value="Calcular Peso Ideal" />
      <input type="reset" value="Limpar campos" />
    </form>

    <h3></h3>

    <script src="js/ex4_2.js"></script>
  </body>
</html>
